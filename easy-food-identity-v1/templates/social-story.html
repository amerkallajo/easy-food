<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easy Food — Editable Story</title><style>
@font-face{font-family:Manrope;src:url('../assets/fonts/Manrope-Variable.ttf') format('truetype');font-weight:200 800;font-display:swap}
@font-face{font-family:Cairo;src:url('../assets/fonts/Cairo-Variable.ttf') format('truetype');font-weight:200 1000;font-display:swap}

*{box-sizing:border-box}body{margin:0;background:#e8e5dd;font-family:Manrope,Cairo,sans-serif;color:#17251C}h1,h2,p{margin:0}.ar{font-family:Cairo,sans-serif;direction:rtl}.canvas{position:relative;overflow:hidden;margin:auto;background:#FFF8EA}.logo{display:block;width:220px}.label{font-size:20px;font-weight:800;letter-spacing:3px}.chip{display:inline-block;border:2px solid currentColor;border-radius:99px;padding:12px 22px;font-size:21px;font-weight:800}.footer{position:absolute;left:70px;right:70px;bottom:65px;display:flex;justify-content:space-between;align-items:center}.grain{display:block;background:#DDF45B;border-radius:100px;width:100px;height:240px;transform:rotate(30deg)}@media print{body{background:white}.canvas{margin:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}}

.canvas{width:1080px;height:1920px;background:#FFF8EA;color:#2448F5;padding:165px 90px}.logo{width:285px}.topline{margin-top:46px;font-size:27px;font-weight:700}.question{margin-top:110px;position:relative;z-index:2}.question h1{font-size:158px;line-height:1.14;letter-spacing:-10px;font-weight:800}.question h1:nth-child(2){display:inline-block;background:#DDF45B;border-radius:32px;padding:0 22px 12px;margin:15px -22px;transform:rotate(-3deg)}.ar-title{font-size:53px;font-weight:800;margin-top:74px;line-height:1.65;text-align:left;position:relative;z-index:2}.protein{margin-top:50px;border-top:2px solid #2448F5;padding-top:35px;display:flex;justify-content:space-between;align-items:center;font-size:29px;font-weight:800}.protein .ar{font-size:35px}.bottom{position:absolute;left:90px;right:90px;bottom:230px;display:flex;justify-content:space-between;align-items:center}.bottom p{font-size:39px;font-weight:800;letter-spacing:-1px}.bottom .ar{font-size:27px;letter-spacing:0}.motif{position:absolute;right:-50px;bottom:-170px;display:flex;gap:30px;transform:rotate(-10deg);opacity:.13}.motif .grain{width:150px;height:450px;background:#2448F5}.motif .grain:nth-child(2){margin-top:-70px}.motif .grain:nth-child(3){margin-top:-140px}@page{size:285.75mm 508mm;margin:0}
</style></head><body><main class="canvas"><img class="logo" src="../assets/logos/logo-stacked-cobalt.svg" alt="Easy Food"><p class="topline">YOUR DAILY EASY.</p><section class="question"><h1>RICE?</h1><h1>WRAP?</h1><h1>SALAD?</h1></section><p class="ar ar-title">شو عبالك اليوم؟</p><div class="protein"><span>CHICKEN / BEEF</span><span class="ar">جاج / لحمة</span></div><footer class="bottom"><p>Eat smart.<br>Live easy.</p><p class="ar">أكلك الصحي،<br>بكل بساطة.</p></footer><div class="motif" aria-hidden="true"><i class="grain"></i><i class="grain"></i><i class="grain"></i></div></main></body></html>
