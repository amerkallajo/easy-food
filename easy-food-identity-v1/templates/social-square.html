<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easy Food — Editable Social Post</title><style>
@font-face{font-family:Manrope;src:url('../assets/fonts/Manrope-Variable.ttf') format('truetype');font-weight:200 800;font-display:swap}
@font-face{font-family:Cairo;src:url('../assets/fonts/Cairo-Variable.ttf') format('truetype');font-weight:200 1000;font-display:swap}

.canvas{width:1080px;height:1080px;background:#2448F5;color:#FFF8EA;padding:70px}.logo{width:245px}.tag{position:absolute;top:78px;right:70px;font-size:18px;letter-spacing:2px;font-weight:800}.headline{font-size:138px;line-height:.99;letter-spacing:-9px;font-weight:800;margin-top:90px;position:relative;z-index:2}.sub{font-size:36px;font-weight:700;margin-top:40px;text-align:left;position:relative;z-index:2}.menu-chips{display:flex;gap:12px;margin-top:55px;position:relative;z-index:2}.chip{background:#DDF45B;color:#17251C;border:0;font-size:25px;padding:16px 25px}.motif{position:absolute;right:-10px;bottom:125px;display:flex;gap:35px;transform:rotate(-10deg);opacity:.14}.motif .grain{width:145px;height:420px}.motif .grain:nth-child(2){margin-top:-70px}.motif .grain:nth-child(3){margin-top:-140px}.footer{font-size:23px;font-weight:700;bottom:64px}.footer .ar{font-size:24px}@page{size:285.75mm 285.75mm;margin:0}
