name: Rebuild Easy Food 3D viewer

on:
  push:
    branches: [main]
    paths:
      - 'easy-food-kitchen-package/model/source/viewer.template.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rebuild self-contained viewer
        run: python3 easy-food-kitchen-package/model/source/make_viewer.py
      - name: Commit updated viewer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add easy-food-kitchen-package/model/viewer/viewer.html
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild published Easy Food 3D viewer"
            git push
          fi
