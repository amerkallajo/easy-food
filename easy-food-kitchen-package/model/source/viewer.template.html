<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easy Food - kitchen model viewer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#f3f1ea;color:#17251C}
  #stage{position:absolute;inset:0}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  body.no-annotations #labels,body.no-annotations #legend{display:none!important}
  .lab{position:absolute;transform:translate(-50%,-50%);background:rgba(255,248,234,.95);border:1.5px solid #146B45;border-radius:6px;
       padding:2px 8px;font-size:14px;font-weight:600;line-height:1.35;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .lab b{color:#146B45;font-weight:800}
  .lab.st{font-size:15px;padding:3px 9px 3px 5px;border-color:#17251C}
  .lab.st[dir=rtl]{padding:3px 5px 3px 9px}
  .lab.st i{display:inline-block;font-style:normal;color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;margin-inline-end:6px}
  .lab.st i.raw{background:#1a6be6}.lab.st i.rte{background:#f5851a}
  .lab.ex{background:#17251C;color:#FFF8EA;border-color:#DDF45B;font-size:15px}
  #bar{position:absolute;left:0;right:0;top:0;padding:8px 16px;background:rgba(20,107,69,.95);color:#FFF8EA;display:flex;justify-content:space-between;align-items:center;gap:14px}
  body.rtl #bar,body.rtl #ui,body.rtl #legend{direction:rtl}
  #title{font-size:18px;font-weight:700}
  #note{font-size:12px;opacity:.92;max-width:60%}
  #ui{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  #ui>div{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  #ui *{pointer-events:auto}
  #ui span.h{font-size:12px;font-weight:700;margin-inline-end:4px}
  button{font:inherit;font-size:13px;border:1px solid #146B45;background:#fff;color:#146B45;border-radius:5px;padding:3px 9px;cursor:pointer}
  button.on{background:#146B45;color:#FFF8EA}
  button.alt{border-color:#17251C;background:#DDF45B;color:#17251C;font-weight:700}
  #legend{position:absolute;right:14px;bottom:110px;background:rgba(255,255,255,.95);border:1px solid #17251C;border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.8;display:none}
  #legend i{display:inline-block;width:34px;height:7px;border-radius:4px;margin-inline-end:8px;vertical-align:middle}
  body.shot #ui{display:none} body.shot #legend{bottom:14px}
  @media (max-width:1000px){.lab{font-size:11px;padding:1px 5px}.lab.st,.lab.ex{font-size:12px}#title{font-size:14px}#note{font-size:10.5px;max-width:50%}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="bar"><div id="title">Easy Food</div><div id="note"></div></div>
<div id="legend"><div><i style="background:#1a6be6"></i><span id="lg-raw"></span></div><div><i style="background:#f5851a"></i><span id="lg-rte"></span></div><div><i style="background:#146B45"></i><span id="lg-staff"></span></div></div>
<div id="ui"><div><span class="h" id="t-view"></span><span id="views" style="display:contents"></span></div>
  <div><span class="h" id="t-layers"></span><span id="layers" style="display:contents"></span></div>
  <div><button class="alt" id="b-lang"></button><button class="alt" id="b-layout"></button><button type="button" class="alt" id="b-labels" aria-controls="labels" aria-pressed="false"></button><span id="t-help" style="font-size:12px;margin-inline-start:8px"></span></div></div>
<script>/*__DATA__*/</script>
<script>/*__BUNDLE__*/</script>
<script>
/* Keep equipment labels optional without changing the model, views, or layers. */
(() => {
  const button = document.getElementById('b-labels');
  let hidden = false;
  const update = () => {
    document.body.classList.toggle('no-annotations', hidden);
    button.textContent = document.documentElement.lang === 'ar'
      ? (hidden ? 'إظهار التسميات' : 'إخفاء التسميات')
      : (hidden ? 'Show labels' : 'Hide labels');
    button.setAttribute('aria-pressed', String(hidden));
    button.title = button.textContent;
  };
  button.addEventListener('click', () => { hidden = !hidden; update(); });
  new MutationObserver(update).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  update();
})();
</script>
</body>
</html>
